# How the Windows lab runner (run-scenarios.ps1) runs each Windows scenario of
# synthaea-lab/scenarios. Same idea as scenarios.conf, fewer columns.
#
# The Windows scenarios have no `.yaml` sidecar yet, so `expect` carries what each one's
# header says must fire, as technique:min_count:tolerance (comma-separated). Once a
# scenario gains a sidecar, the runner reads the sidecar instead and this column is ignored.
#
# name                          | set     | expect        | note
encoded-powershell              | default | T1059.001:3:0 | -
scheduled-task-persistence      | default | T1053.005:3:0 | needs the Security log (elevated WinRM session)
service-install-persistence     | default | T1543.003:3:0 | creates and deletes demo services that never run
create-account-persistence      | default | T1136.001:3:0 | creates and deletes local demo accounts
bits-job                        | opt-in  | T1197:1:0     | self-checking: run it directly with -AgentExe (starts its own agent)
windows-container               | opt-in  | -             | self-checking with -AgentExe; needs the Containers feature and Docker in Windows mode
