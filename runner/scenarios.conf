# How the runner (run-scenarios.sh) runs each Linux scenario of synthaea-lab/scenarios.
#
# What a scenario must trigger is NOT here: it is the scenario's own `.yaml` sidecar
# (`expected_detections`), read as is (the ML pipeline binds model records to those bytes,
# so they are never edited for the lab's sake). This file only says how to run it here.
#
# Columns, `|`-separated, `-` for empty:
#   name         scenario stem (<scenarios>/scenarios/<name>.sh + <name>.yaml)
#   set          default = safe and self-contained, part of a plain `python rig.py run`;
#                opt-in  = needs setup the runner does not do (see note); runs only by name
#   root         yes = the script runs under sudo
#   needs        space-separated: commands that must exist, `lsm:<name>` for an active LSM;
#                a missing need is a SKIP with the reason, not a failure
#   min_kernel   oldest kernel the detection can work on (older: SKIP with the reason)
#   agent_flags  extra `agent run` flags for this scenario
#   env          space-separated KEY=VALUE for the script
#   yara         extra YARA files from the scenarios directory, added to the run's content
#   settle       seconds to wait after the script before reading alerts (default 3; the
#                runner also waits until the alert file has been quiet for 2 s)
#   note         why a scenario is opt-in, or what to know
#
# name                   | set     | root | needs          | min_kernel | agent_flags          | env            | yara               | settle | note
argv                     | default | no   | -              | -          | -                    | -              | -                  | 2      | -
beacon                   | default | no   | nc             | -          | -                    | -              | -                  | 3      | -
bind-shell               | default | no   | nc             | -          | -                    | -              | -                  | 3      | holds its listener 12 s for the 10 s netlink poll
dns-exfil                | default | no   | python3        | -          | --enable-dns-capture | -              | -                  | 3      | glibc only (getaddrinfo uprobe)
dropper-chain            | default | no   | nc curl        | -          | -                    | -              | -                  | 3      | -
ld-preload-hijack        | default | no   | cc             | -          | -                    | -              | -                  | 2      | -
lineage                  | default | no   | -              | -          | -                    | -              | -                  | 2      | -
log-clear                | default | yes  | -              | -          | -                    | -              | -                  | 2      | -
persistence-write        | default | no   | -              | -          | -                    | -              | -                  | 2      | appends to and restores the guest user's ~/.bashrc
pid-reuse                | default | yes  | python3        | -          | -                    | -              | -                  | 3      | -
ransomware-rename-burst  | default | no   | python3        | -          | -                    | -              | -                  | 3      | -
respawn-beacon           | default | no   | nc             | -          | -                    | -              | -                  | 3      | -
response                 | default | no   | nc             | -          | -                    | EXPECT=observe | response-marker.yar | 5      | observe mode: the agent runs without --enable-kill/--enable-quarantine
signal                   | default | yes  | -              | -          | -                    | -              | -                  | 3      | live mode only (kill/verify-kill restart the agent)
timestomp-linux          | default | no   | lsm:bpf        | 6.3        | -                    | -              | -                  | 2      | the inode_setattr hook needs the (idmap, dentry, attr) signature of 6.3+
mysql-failed-login       | opt-in  | no   | mariadb/mysql  | -          | -                    | -              | -                  | 3      | needs MariaDB/MySQL logging to a file and a [[logs.sources]] mysql_error entry in agent.toml
web-webshell             | opt-in  | no   | curl           | -          | -                    | -              | -                  | 3      | needs nginx/Apache on :80 and a [[logs.sources]] access_combined entry in agent.toml
web-webshell-php         | opt-in  | yes  | curl           | -          | -                    | -              | -                  | 3      | needs Apache + PHP-FPM on :80 and a [[logs.sources]] access_combined entry in agent.toml
web-custom-logformat     | opt-in  | no   | curl           | -          | -                    | -              | -                  | 3      | needs an Apache vhost with a custom LogFormat on :8081, declared access_combined in agent.toml
ransomware-reflex        | opt-in  | no   | python3        | -          | -                    | EXPECT=observe | -                  | 3      | needs [deception] canary_dirs in agent.toml and CANARY_DIR set to it
prevalence-lineage       | opt-in  | no   | -              | -          | -                    | TAG=lab        | -                  | 3      | needs an agent uploading to a control plane (not --standalone) and a second host
