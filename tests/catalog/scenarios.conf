# A runner catalog in the shape of runner/scenarios.conf, for `run-scenarios.sh --catalog-rows`.
# Its `# reads:` lines are what the runner must read from the rows below, one
# `name|set|root|needs|min_kernel|agent_flags|env|yara|settle|note` line per row, in order:
# cells trimmed, `-` read as empty, blank and comment lines skipped, the note keeping any `|`.
#
# name     | set     | root | needs          | min_kernel | agent_flags  | env         | yara        | settle | note
plain      | default | no   | -              | -          | -            | -           | -           | 2      | -

   # an indented comment is skipped too
full       | opt-in  | yes  | nc curl/wget   | 5.8        | --flag-a --b | A=1 B=two   | x.yar y.yar | 10     | needs setup: see the README
	tabbed	|	default	|	no	|	lsm:bpf	|	-	|	-	|	-	|	-	|	-	|	tabs around cells
piped      | default | no   | -              | -          | -            | -           | -           | 3      | a note | with a pipe
short      | opt-in
#
# reads: plain|default|no||||||2|
# reads: full|opt-in|yes|nc curl/wget|5.8|--flag-a --b|A=1 B=two|x.yar y.yar|10|needs setup: see the README
# reads: tabbed|default|no|lsm:bpf||||||tabs around cells
# reads: piped|default|no||||||3|a note | with a pipe
# reads: short|opt-in||||||||
